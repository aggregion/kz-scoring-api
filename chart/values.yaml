replicaCount: 1

image:
  repository: ghcr.io/aggregion/kz-scoring-api
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

config:
  vaultee_pipelines_url: "http://vlt-system-prod-vaultee-pipelines.vaultee.svc.cluster.local:3008/graphql"
  vaultee_secrets_url: "http://vlt-system-prod-vaultee-secrets.vaultee.svc.cluster.local"
  beeline_secrets_url_for_pipeline: "http://vlt-system-prod-vaultee-secrets.vaultee.svc.cluster.local"
  salt_pkb_secret_token: "pkb_beeline/SALT_PKB"
  iin_salt: "secretsalt20260406"
  pipelines:
    lookup_iin_only_template_id: ""
    lookup_iin_phone_template_id: ""
    executor_id: ""
  timeout_seconds: 30
  poll_interval_ms: 100
  max_concurrent_lookups: 10
  salt_cache_ttl_seconds: 300
  log_level: "INFO"
  # Paths inside the container where LightGBM booster txt files are mounted.
  # Leave empty to disable scoring (endpoints return raw feature rows only).
  # If you enable ``models.volume`` below, defaults line up with its mountPath.
  hh_model_path: ""
  cg_model_path: ""

# Optional volume that materialises HH/CG LightGBM model files inside the pod.
# The volume is mounted at ``mountPath`` on the app container; put your
# ``config.hh_model_path`` / ``config.cg_model_path`` values under that path.
#
# Example — mount from an existing PVC that DevOps populates out of band:
#   models:
#     volume:
#       enabled: true
#       mountPath: /models
#       persistentVolumeClaim:
#         claimName: kz-scoring-models
#   config:
#     hh_model_path: /models/hh_beeline_bezzalog_2026_05_04_model.txt
#     cg_model_path: /models/cg_beeline_bezzalog_2026_05_04_model.txt
#
# Example — mount from a ConfigMap or Secret; use the same keys the k8s
# volume type accepts (``configMap``, ``secret``, ``persistentVolumeClaim``,
# ``hostPath``, ``emptyDir``, …). Exactly one source key should be set.
models:
  volume:
    enabled: false
    mountPath: /models
    readOnly: true
    # persistentVolumeClaim:
    #   claimName: kz-scoring-models
    # configMap:
    #   name: kz-scoring-models
    # secret:
    #   secretName: kz-scoring-models

extraEnv: []
